# Location of the universalsync executable
env UNIVERSAL SYNC_EXE="/usr/local/bin"

# Set the name of the application
description "UniversalSync"

# Start universalsync you login to your desktop
start on desktop-start

# Stop universalsync you logout of your desktop
stop on desktop-end

# Set STNORESTART to yes to have Upstart monitor the process instead
# of having a separate universalsync process do the monitoring
env STNORESTART=yes

# If Upstart detects universalsync has failed - it should restart it
respawn

# the universalsync command Upstart is to execute when it is started up
exec $UNIVERSAL SYNC_EXE --no-browser
