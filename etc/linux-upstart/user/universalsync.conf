# Location of the universal sync executable
env UNIVERSAL SYNC_EXE="/usr/local/bin"

# Set the name of the application
description "Universal Sync"

# Start universal sync you login to your desktop
start on desktop-start

# Stop universal sync you logout of your desktop
stop on desktop-end

# Set STNORESTART to yes to have Upstart monitor the process instead
# of having a separate universal sync process do the monitoring
env STNORESTART=yes

# If Upstart detects universal sync has failed - it should restart it
respawn

# the universal sync command Upstart is to execute when it is started up
exec $UNIVERSAL SYNC_EXE --no-browser
